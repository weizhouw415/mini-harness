[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-harness"
version = "0.1.0"
description = "A two-tool agent harness with remote execution workers"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.34,<1", "websockets>=14,<17", "PyYAML>=6,<7"]

[project.optional-dependencies]
cloud = ["playwright==1.62.0"]
desktop = ["PyAutoGUI>=0.9.54,<1", "Pillow>=10"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
mini-harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*", "workers*"]

[tool.setuptools.package-data]
"harness.api" = ["web/*.html", "web/*.css", "web/*.js", "web/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
